<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employee List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-4">Employee Management</h1>
    <a href="add.html" class="btn btn-success mb-3">Add Employee</a>
	<div class="mb-3">
  <input
    type="text"
    id="searchInput"
    class="form-control"
    placeholder="Search employees by name, email, department, or role..."
  />
</div>

    <table class="table table-bordered">
      <thead>
  <tr>
    <th onclick="sortTable('name')">Name</th>
    <th onclick="sortTable('email')">Email</th>
    <th onclick="sortTable('department')">Department</th>
    <th onclick="sortTable('role')">Role</th>
    <th onclick="sortTable('dateOfJoining')">Date of Joining</th>
    <th>Actions</th>
  </tr>
</thead>
      <tbody id="employeeTableBody"></tbody>
    </table>
<nav>
  <ul class="pagination" id="paginationControls"></ul>
</nav>

  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
